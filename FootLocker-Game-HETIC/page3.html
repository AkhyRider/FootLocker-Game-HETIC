<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeu - Page 3</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="card-container game-mode">

        <h1 class="main-title">SLOT LOCKER</h1>

        <div class="game-layout">
            <div class="slot-machine">
                <div class="reel" id="reel1">
                    <div class="reel-strip">
                        <img src="images/icon-foot.png" alt="1">
                        <img src="images/icon-basket.png" alt="2">
                        <img src="images/icon-cap.png" alt="3">
                        <img src="images/icon-foot.png" alt="1">
                    </div>
                </div>
                <div class="reel" id="reel2">
                    <div class="reel-strip">
                        <img src="images/icon-basket.png" alt="2">
                        <img src="images/icon-cap.png" alt="3">
                        <img src="images/icon-foot.png" alt="1">
                        <img src="images/icon-basket.png" alt="2">
                    </div>
                </div>
                <div class="reel" id="reel3">
                    <div class="reel-strip">
                        <img src="images/icon-cap.png" alt="3">
                        <img src="images/icon-foot.png" alt="1">
                        <img src="images/icon-basket.png" alt="2">
                        <img src="images/icon-cap.png" alt="3">
                    </div>
                </div>

                <div class="lever-container" onclick="pullLever()">
                    <div class="lever-ball"></div>
                    <div class="lever-stick"></div>
                </div>
            </div>
        </div>
        <div id="result-message" class="result-message"></div>
    </main>

    <img src="images/foot-locker-logo 1.png" alt="Logo" class="logo-corner">

    <script>
        let img1 = "images/icon-foot.png", img2 = "images/icon-basket.png", img3 = "images/icon-cap.png";
        let clics = parseInt(sessionStorage.getItem('compteurDeClics') || "0");
        let tourne = false;

        function pullLever() {
            if (tourne) return;
            tourne = true;
            sessionStorage.setItem('compteurDeClics', ++clics);

            let msg = document.getElementById('result-message');
            msg.className = "result-message"; msg.textContent = "";

            let lever = document.querySelector('.lever-container');
            lever.classList.add('lever-pull');
            setTimeout(() => lever.classList.remove('lever-pull'), 300);

            let reels = [1, 2, 3].map(i => document.getElementById('reel' + i));
            reels.forEach(r => r.classList.add('reel-spin'));

            let gagne = (clics === 3) || (clics > 3 && (clics - 3) % 5 === 0);

            let stopReel = (i, img, delay) => {
                setTimeout(() => {
                    reels[i].classList.remove('reel-spin');
                    reels[i].querySelector('img').src = img;
                }, delay);
            };

            stopReel(0, img1, 1000);
            stopReel(1, gagne ? img1 : img2, 1500);

            setTimeout(() => {
                reels[2].classList.remove('reel-spin');
                reels[2].querySelector('img').src = gagne ? img1 : img3;

                msg.textContent = gagne ? "Gagné ! Redirection..." : "Perdu... Redirection...";
                msg.classList.add(gagne ? "win" : "lose");

                setTimeout(() => window.location.href = gagne ? "page_win.html" : "page_lose.html", 1000);
            }, 2000);
        }
    </script>
</body>

</html>
