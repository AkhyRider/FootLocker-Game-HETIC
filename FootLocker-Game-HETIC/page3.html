<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeu - Page 3</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="card-container game-mode">

        <h1 class="main-title">SLOT LOCKER</h1>

        <div class="game-layout">
            <div class="slot-machine">
                <div class="reel" id="reel1">
                    <img src="images/icon-foot.png" alt="1">
                </div>
                <div class="reel" id="reel2">
                    <img src="images/icon-basket.png" alt="2">
                </div>
                <div class="reel" id="reel3">
                    <img src="images/icon-cap.png" alt="3">
                </div>

                <div class="lever-container" onclick="pullLever()">
                    <div class="lever-ball"></div>
                    <div class="lever-stick"></div>
                </div>
            </div>
        </div>
        <div id="result-message" class="result-message"></div>
    </main>

    <img src="images/foot-locker-logo 1.png" alt="Logo" class="logo-corner">

    <script>
        // prendre les 3 img pour l'animation du slot locker
        let image1 = "images/icon-foot.png";
        let image2 = "images/icon-basket.png";
        let image3 = "images/icon-cap.png";

        let imagesPossibles = [image1, image2, image3];

        let compteurDeClics = 0; // Pour compter combien de fois le joueur a cliqué
        let estEnTrainDeTourner = false; // Pour empêcher de cliquer plusieurs fois en même temps

        function pullLever() {
            // si c'est déjà en train de tourne on peut pas réappuyer sur le bouton 
            if (estEnTrainDeTourner == true) {
                return;
            }

            // On récupère les éléments HTML dont on a besoin
            let balleDuLevier = document.querySelector('.lever-ball');
            let messageResultat = document.getElementById('result-message');

            let imageReel1 = document.querySelector('#reel1 img');
            let imageReel2 = document.querySelector('#reel2 img');
            let imageReel3 = document.querySelector('#reel3 img');

            if (balleDuLevier) {
                estEnTrainDeTourner = true;
                compteurDeClics = compteurDeClics + 1;

                // On efface le message précédent
                messageResultat.textContent = "";
                messageResultat.className = "result-message";

                // 1. Animation du levier 
                balleDuLevier.style.transition = "top 0.3s ease";
                balleDuLevier.style.top = "50px";

                setTimeout(function () {
                    balleDuLevier.style.top = "0px";
                }, 300);

                // 2. Faire tourner les images très vite
                let interval1 = setInterval(function () {
                    let nombreAleatoire = Math.floor(Math.random() * 3); // Donne 0, 1 ou 2
                    imageReel1.src = imagesPossibles[nombreAleatoire];
                }, 100);

                let interval2 = setInterval(function () {
                    let nombreAleatoire = Math.floor(Math.random() * 3);
                    imageReel2.src = imagesPossibles[nombreAleatoire];
                }, 100);

                let interval3 = setInterval(function () {
                    let nombreAleatoire = Math.floor(Math.random() * 3);
                    imageReel3.src = imagesPossibles[nombreAleatoire];
                }, 100);

                // 3. HASARD pour savoir si le joueur gagne ou perd
                let leJoueurAGagne = false;

                if (compteurDeClics == 3) {
                    leJoueurAGagne = true;
                } else if (compteurDeClics > 3) {
                    let ecartDeClics = compteurDeClics - 3;
                    if (ecartDeClics % 5 == 0) {
                        leJoueurAGagne = true;
                    }
                }

                // 4. Arrêts successifs et résultats
                setTimeout(function () {
                    clearInterval(interval1);
                    imageReel1.src = image1;
                }, 1000);

                setTimeout(function () {
                    clearInterval(interval2);
                    if (leJoueurAGagne == true) {
                        imageReel2.src = image1;
                    } else {
                        imageReel2.src = image2;
                    }
                }, 1500);

                setTimeout(function () {
                    clearInterval(interval3);
                    if (leJoueurAGagne == true) {
                        imageReel3.src = image1;
                        messageResultat.textContent = "C'est Gagné !! -40% offert sur toute la boutique";
                        messageResultat.classList.add('win');
                    } else {
                        imageReel3.src = image3;
                        messageResultat.textContent = "Perdu... retentez votre chance une prochaine fois !";
                        messageResultat.classList.add('lose');
                    }

                    estEnTrainDeTourner = false;

                }, 2000);
            }
        }
    </script>
</body>

</html>
